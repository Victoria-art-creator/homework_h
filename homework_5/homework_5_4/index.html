<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework_5_4</title>
  </head>
  <body>
    <script>
      let num = parseInt(prompt("Enter a prime number: "));
      let numPrime = true;

      if (num <= 1) {
        numPrime = false;
      } else {
        for (let i = 2; i < num; i++) {
          if (num % i === 0) {
            numPrime = false;
            break;
          }
        }
      }

      if (numPrime) {
        alert(`${num} is the prime number`);
      } else {
        alert(`${num} is not the prime number`);
      }
    </script>
  </body>
</html>
