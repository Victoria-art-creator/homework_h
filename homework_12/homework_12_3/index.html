<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework_12_3</title>
  </head>
  <body>
    <ul id="todoList">
      <li>Task 1 <button class="delete-btn">Delete</button></li>
      <li>Task 2 <button class="delete-btn">Delete</button></li>
      <li>Task 3 <button class="delete-btn">Delete</button></li>
    </ul>
    <form id="taskForm">
      <input type="text" id="newTask" placeholder="Add new task" />
      <button type="submit">Add</button>
    </form>
    <script>
      const todoList = document.getElementById("todoList");
      const taskForm = document.getElementById("taskForm");
      const newTaskInput = document.getElementById("newTask");

      todoList.addEventListener("click", function (event) {
        if (event.target.classList.contains("delete-btn")) {
          event.target.parentElement.remove();
        }
      });

      taskForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const taskText = newTaskInput.value.trim();
        if (taskText === "") return;

        const li = document.createElement("li");
        const text = document.createTextNode(taskText + " ");
        const btn = document.createElement("button");

        btn.textContent = "Delete";
        btn.classList.add("delete-btn");

        li.appendChild(text);
        li.appendChild(btn);

        todoList.appendChild(li);

        newTaskInput.value = "";
      });
    </script>
  </body>
</html>
