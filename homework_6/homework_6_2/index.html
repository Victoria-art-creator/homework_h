  <body>
    <script>
      const numbers = [2, 3, 6, 7, 9, 11, 13, 12, 10, 8];

      const evenNumbers = numbers.filter(function (number) {
        return number % 2 === 0;
      });

      console.log(evenNumbers); //[2, 6, 12, 10, 8]
    </script>
