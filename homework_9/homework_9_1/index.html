<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>homework_9_1</title>
  </head>
  <body>
    <script>
      "use strict";
      let ladder = {
        step: 0,
        up: function () {
          this.step++;
          return this;
        },
        down: function () {
          this.step--;
          return this;
        },
        showStep: function () {
          console.log(this.step);
          return this;
        },
      };
      ladder.up().up().down().showStep(); // 1
    </script>
  </body>
</html>
