<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework_20</title>
    <link rel="stylesheet" href="main.css" />
    <link
      href="/node_modules/bootstrap//dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>ToDoList</h1>

      <form class="form js--form d-flex" id="todoForm">
        <input
          type="text"
          name="value"
          required
          class="form__input js--form__input me-2"
          placeholder="Enter task..."
          id="todoInput"
        />
        <button class="form__btn btn" type="submit">Add</button>
      </form>

      <ul class="list-unstyled js--todos-wrapper" id="todosWrapper"></ul>
    </div>

    <div
      class="modal fade"
      id="todoModal"
      tabindex="-1"
      aria-labelledby="todoModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="todoModalLabel">Your task</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="todoModalBody"></div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="/node_modules/jquery/dist/jquery.min.js"></script>
    <script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="build/main.js"></script>
  </body>
</html>
