<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework_7_3</title>
  </head>
  <body>
    <script>
      function removeElement(array, item) {
        let newArray = [];

        for (let i = 0; i < array.length; i++) {
          if (array[i] !== item) {
            newArray.push(array[i]);
          }
        }

        return newArray;
      }

      const array = [1, 3, 4, 6, 2, 5, 7];
      console.log(removeElement(array, 4)); // Result: [1, 3, 6, 2, 5, 7]
    </script>
  </body>
</html>
