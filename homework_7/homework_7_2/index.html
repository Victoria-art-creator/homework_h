<!DOCTYPE html>

  <body>
    <script>
      function calcArithmeticMean(array) {
        let result = 0;
        let count = 0;
        for (let i = 0; i < array.length; i++) {
          if (typeof array[i] === "number") {
            result += array[i];
            count++;
          }
        }
        return result / count;
      }

      const arr = [5, true, "hi", 23, null, 10, 12, undefined];
      console.log(calcArithmeticMean(arr));
    </script>
  </body>
