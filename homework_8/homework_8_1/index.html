<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework_8_1</title>
  </head>
  <body>
    <script>
      "use strict";
      let sum = (function () {
        let total = 0;
        return function (num) {
          total += num;
          return total;
        };
      })();

      console.log(sum(4)); // 4
      console.log(sum(6)); // 10
      console.log(sum(10)); // 20
      console.log(sum(7)); // 27
    </script>
  </body>
</html>
